# Only the modules' /{module}/api routes are routed: the RPC routes ({module}/rpc/…) stay inside.
http:
  routers:
    # Registration, login and refresh: no identity yet. Logout goes through `auth`.
    iam:
      rule: Method(`POST`) && (Path(`/iam/api/v1/register`) || Path(`/iam/api/v1/login`) || Path(`/iam/api/v1/refresh`))
      service: iam
    iam-authenticated:
      rule: PathPrefix(`/iam/api`)
      middlewares: [auth]
      service: iam
    analytics:
      rule: PathPrefix(`/analytics/api`)
      middlewares: [auth]
      service: analytics
    notifications:
      rule: PathPrefix(`/notifications/api`)
      middlewares: [auth]
      service: notifications

  services:
    iam:
      loadBalancer:
        servers: [{ url: "http://iam.svc:8000" }]
    analytics:
      loadBalancer:
        servers: [{ url: "http://analytics:8000" }]
    notifications:
      loadBalancer:
        servers: [{ url: "http://notifications:8000" }]
