# The middlewares the routers use. auth is the plugin of gateway/plugins/auth; Traefik's own
# middlewares (rateLimit, headers, retry, compress) go here too, without code.
http:
  middlewares:
    auth:
      plugin:
        auth:
          # signature or issuer: the same as iam's, which issues its tokens for it
          strategy: {{ env "AUTH_TOKEN_VALIDATION_STRATEGY" | default "signature" | quote }}
          redis: gateway-cache:6379
          redisUser: traefik
          redisPassword: {{ env "REDIS_TRAEFIK_PASSWORD" | quote }}
          userKey: "gateway:user:"
          iam: http://iam.svc:8000/iam/api/v1/identity
          # iam writes it to the jwt-keys volume (auth:jwt-keys); an outside issuer's goes in publicKey instead
          publicKeyFile: /keys/jwt-public.key
          gatewaySecret: {{ env "AUTH_GATEWAY_SECRET" | quote }}
