# Traefik's static configuration: where clients come in, where the routes are, which plugins load.
entryPoints:
  web:
    address: ":80"

providers:
  file:
    # Every file of dynamic/: the routes, the middlewares.
    directory: /etc/traefik/dynamic

experimental:
  localPlugins:
    # gateway/plugins/auth, mounted under /plugins-local/src/github.com/mk-josias/gatewayauth
    auth:
      moduleName: github.com/mk-josias/gatewayauth
