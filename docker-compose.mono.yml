# Every module in one container, behind Traefik, the only way into the API: http://localhost:8000.
# Traefik checks the client's token (gateway/) and sends the modules the X-Identity they trust;
# the Reverb port 8080 is the one other entry (the live push), authenticated by Reverb.
# Three networks: `public` (Traefik and the app), `internal` (the app, Postgres, Redis) and
# `gateway` (the app, Traefik and gateway-cache): Traefik reaches neither Postgres nor Redis.
# Postgres holds one database per module; Redis carries the events.
# Development values only: in production, set real secrets.

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
  APP_URL: "http://localhost:8000"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_USERNAME: distributable
  DB_PASSWORD: distributable
  DB_APP_USERNAME: distributable_app
  DB_APP_PASSWORD: distributable_app
  REDIS_HOST: redis
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: redis
  DISTRIBUTABLE_STREAM_DRIVER: redis
  DISTRIBUTABLE_STREAM_GUARD: "false"
  AUTH_GATEWAY_SECRET: ${AUTH_GATEWAY_SECRET:-gateway-secret}
  AUTH_TOKEN_VALIDATION_STRATEGY: ${AUTH_TOKEN_VALIDATION_STRATEGY:-signature}
  DISTRIBUTABLE_RPC_SECRET: ${DISTRIBUTABLE_RPC_SECRET:-rpc-secret}
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: distributable
  REVERB_APP_KEY: distributable-key
  REVERB_APP_SECRET: distributable-secret
  REVERB_HOST: localhost
  REVERB_PORT: "8080"
  REVERB_SCHEME: http

services:

  traefik:
    image: traefik:v3.6
    networks: [public, gateway]
    environment:
      AUTH_GATEWAY_SECRET: ${AUTH_GATEWAY_SECRET:-gateway-secret}
      AUTH_TOKEN_VALIDATION_STRATEGY: ${AUTH_TOKEN_VALIDATION_STRATEGY:-signature}
      DISTRIBUTABLE_RPC_SECRET: ${DISTRIBUTABLE_RPC_SECRET:-rpc-secret}
      REDIS_TRAEFIK_PASSWORD: ${REDIS_TRAEFIK_PASSWORD:-traefik-password}
    volumes:
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./gateway/plugins/auth:/plugins-local/src/github.com/mk-josias/gatewayauth:ro
      - jwt-keys:/keys:ro
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      additional_contexts:
        packages: ${DISTRIBUTABLE_PACKAGES:-docker/no-packages}
    image: distributable-skeleton:mono
    environment:
      <<: *env
      RUN_MODULES: "*"
      WITH_CONSUMERS: "true"
      WITH_SCHEDULER: "true"
      WITH_WORKER: "true"
      WITH_REVERB: "true"
      SYNC_PERMISSIONS: "true"
      WITH_JWT_KEYS: "true"
      AUTH_JWT_KEYS_PATH: /keys
      AUTH_GATEWAY_USERS_CONNECTION: gateway
      GATEWAY_REDIS_HOST: gateway-cache
      GATEWAY_REDIS_USERNAME: iam
      GATEWAY_REDIS_PASSWORD: ${GATEWAY_CACHE_IAM_PASSWORD:-iam-password}
    volumes:
      - jwt-keys:/keys
    ports:
      - "${REVERB_PUBLIC_PORT:-8080}:8080"
    # gateway/traefik/dynamic/routers.yml names one host per module: here, all of them are this container.
    networks:
      public:
        aliases: [iam.svc, analytics, notifications]
      internal:
      gateway:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    build: ./docker/postgres
    image: distributable-postgres:local
    networks: [internal]
    environment:
      POSTGRES_DB: distributable
      POSTGRES_USER: distributable
      POSTGRES_PASSWORD: distributable
      DB_APP_PASSWORD: distributable_app
      MODULE_DATABASES: "iam analytics notifications"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "distributable"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The users the gateway reads: only iam writes it, only Traefik reads it, nobody else joins `gateway`.
  gateway-cache:
    image: valkey/valkey:8-alpine
    networks: [gateway]
    environment:
      GATEWAY_CACHE_IAM_PASSWORD: ${GATEWAY_CACHE_IAM_PASSWORD:-iam-password}
    command: [valkey-server,
      --user, default, "off",
      --user, iam, "on", ">${GATEWAY_CACHE_IAM_PASSWORD:-iam-password}", "~gateway:user:*", "+@connection", "+setex", "+del", "+ping",
      --user, traefik, "on", ">${REDIS_TRAEFIK_PASSWORD:-traefik-password}", "~gateway:user:*", "+get", "+select"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --user iam --pass \"$$GATEWAY_CACHE_IAM_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  # iam's JWT key pair: the app writes it, Traefik reads the public key.
  jwt-keys:

networks:
  public:
  internal:
  gateway:
