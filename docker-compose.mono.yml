# Every module in one container, behind Traefik, the only way in: http://localhost:8000. Traefik
# checks the client's token (gateway/) and sends the modules the X-Identity they trust.
# Postgres holds one database per module; Redis carries the events.
# Development values only: in production, set real secrets.

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
  APP_URL: "http://localhost:8000"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_USERNAME: distributable
  DB_PASSWORD: distributable
  DB_APP_USERNAME: distributable_app
  DB_APP_PASSWORD: distributable_app
  REDIS_HOST: redis
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: redis
  MICROSERVICES_STREAM_DRIVER: redis
  MICROSERVICES_STREAM_GUARD: "false"
  AUTH_GATEWAY_SECRET: ${AUTH_GATEWAY_SECRET:-gateway-secret}
  AUTH_TOKEN_VALIDATION_STRATEGY: ${AUTH_TOKEN_VALIDATION_STRATEGY:-signature}
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: distributable
  REVERB_APP_KEY: distributable-key
  REVERB_APP_SECRET: distributable-secret
  REVERB_HOST: localhost
  REVERB_PORT: "8080"
  REVERB_SCHEME: http

services:

  traefik:
    image: traefik:v3.6
    environment:
      AUTH_GATEWAY_SECRET: ${AUTH_GATEWAY_SECRET:-gateway-secret}
      AUTH_TOKEN_VALIDATION_STRATEGY: ${AUTH_TOKEN_VALIDATION_STRATEGY:-signature}
      REDIS_TRAEFIK_PASSWORD: ${REDIS_TRAEFIK_PASSWORD:-traefik-password}
    volumes:
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./gateway/plugins/auth:/plugins-local/src/github.com/mk-josias/gatewayauth:ro
      - jwt-keys:/keys:ro
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      additional_contexts:
        distributable: ${DISTRIBUTABLE_PACKAGES:-docker/no-packages}
        microservices: ${MICROSERVICES_PACKAGES:-docker/no-packages}
    image: distributable-skeleton:mono
    environment:
      <<: *env
      RUN_MODULES: "*"
      WITH_CONSUMERS: "true"
      WITH_SCHEDULER: "true"
      WITH_WORKER: "true"
      WITH_REVERB: "true"
      SYNC_PERMISSIONS: "true"
      WITH_JWT_KEYS: "true"
      AUTH_JWT_KEYS_PATH: /keys
    volumes:
      - jwt-keys:/keys
    ports:
      - "${REVERB_PUBLIC_PORT:-8080}:8080"
    # gateway/traefik/dynamic/routers.yml names one host per module: here, all of them are this container.
    networks:
      default:
        aliases: [iam.svc, analytics, notifications]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    build: ./docker/postgres
    image: distributable-postgres:local
    environment:
      POSTGRES_DB: distributable
      POSTGRES_USER: distributable
      POSTGRES_PASSWORD: distributable
      DB_APP_PASSWORD: distributable_app
      MODULE_DATABASES: "iam analytics notifications"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "distributable"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    # Traefik's user may only read the users iam's RpcService cached: neither write nor read the stream.
    command: [valkey-server,
      --user, default, "on", nopass, "~*", "&*", "+@all",
      --user, traefik, "on", ">${REDIS_TRAEFIK_PASSWORD:-traefik-password}", "~database:cache:iam:user:*", "+get", "+select"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  # iam's JWT key pair: the app writes it, Traefik reads the public key.
  jwt-keys:
