# One container per module, each from an image that holds only its module (modules:purge), behind
# Traefik, the only way in: http://localhost:8000. Traefik checks the client's token (gateway/) and
# sends the modules the X-Identity they trust; their own ports stay private, except notifications'
# Reverb on 8080 (the live push), which authenticates its channels itself.
# Three networks: `public` (Traefik and the modules), `internal` (the modules, Postgres, Redis) and
# `gateway` (iam, Traefik and gateway-cache): Traefik reaches neither Postgres nor Redis.
# analytics reaches iam over HTTP at iam-rpc, a container of iam's image that only answers the calls
# between modules (port 8001); both share APP_KEY, which signs those calls.
# Development values only: in production, set real secrets.

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_USERNAME: distributable
  DB_PASSWORD: distributable
  DB_APP_USERNAME: distributable_app
  DB_APP_PASSWORD: distributable_app
  REDIS_HOST: redis
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: redis
  DISTRIBUTABLE_STREAM_DRIVER: redis
  DISTRIBUTABLE_STREAM_GUARD: "false"
  AUTH_GATEWAY_SECRET: ${AUTH_GATEWAY_SECRET:-gateway-secret}
  AUTH_TOKEN_VALIDATION_STRATEGY: ${AUTH_TOKEN_VALIDATION_STRATEGY:-signature}
  IAM_HOST: "http://iam-rpc:8001"
  DISTRIBUTABLE_RPC_PORT: "8001"
  OCTANE_WORKERS: "2"
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: distributable
  REVERB_APP_KEY: distributable-key
  REVERB_APP_SECRET: distributable-secret
  REVERB_HOST: localhost   # the Reverb of the container that pushes
  REVERB_PORT: "8080"
  REVERB_SCHEME: http

x-build: &build
  context: .
  dockerfile: docker/Dockerfile
  additional_contexts:
    packages: ${DISTRIBUTABLE_PACKAGES:-docker/no-packages}

x-module: &module
  networks: [public, internal]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:

  traefik:
    image: traefik:v3.6
    networks: [public, gateway]
    environment:
      AUTH_GATEWAY_SECRET: ${AUTH_GATEWAY_SECRET:-gateway-secret}
      AUTH_TOKEN_VALIDATION_STRATEGY: ${AUTH_TOKEN_VALIDATION_STRATEGY:-signature}
      REDIS_TRAEFIK_PASSWORD: ${REDIS_TRAEFIK_PASSWORD:-traefik-password}
    volumes:
      - ./gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./gateway/plugins/auth:/plugins-local/src/github.com/mk-josias/gatewayauth:ro
      - jwt-keys:/keys:ro
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    depends_on:
      iam:
        condition: service_healthy

  iam:
    <<: *module
    build:
      <<: *build
      args:
        RUN_MODULES: iam
    image: distributable-skeleton:iam
    environment:
      <<: *env
      RUN_MODULES: iam
      WITH_CONSUMERS: "true"
      SYNC_PERMISSIONS: "true"
      WITH_JWT_KEYS: "true"
      AUTH_JWT_KEYS_PATH: /keys
      AUTH_GATEWAY_USERS_CONNECTION: gateway
      GATEWAY_REDIS_HOST: gateway-cache
      GATEWAY_REDIS_USERNAME: iam
      GATEWAY_REDIS_PASSWORD: ${GATEWAY_CACHE_IAM_PASSWORD:-iam-password}
    volumes:
      - jwt-keys:/keys
    networks:
      public:
        aliases: [iam.svc]
      internal:
      gateway:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway-cache:
        condition: service_healthy

  # iam's RPC, from iam's image: the calls between modules never wait behind the API's requests.
  iam-rpc:
    <<: *module
    image: distributable-skeleton:iam
    environment:
      <<: *env
      RUN_MODULES: iam
      WITH_HTTP: "false"
      WITH_RPC: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': </dev/tcp/localhost/8001'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      iam:
        condition: service_healthy

  analytics:
    <<: *module
    build:
      <<: *build
      args:
        RUN_MODULES: analytics
    image: distributable-skeleton:analytics
    environment:
      <<: *env
      RUN_MODULES: analytics
      WITH_CONSUMERS: "true"
      WITH_SCHEDULER: "true"   # analytics:compute, hourly

  notifications:
    <<: *module
    build:
      <<: *build
      args:
        RUN_MODULES: notifications
    image: distributable-skeleton:notifications
    environment:
      <<: *env
      RUN_MODULES: notifications
      WITH_CONSUMERS: "true"
      WITH_WORKER: "true"    # the mails, queued
      WITH_REVERB: "true"    # the live push, ws://localhost:8080
    ports:
      - "${REVERB_PUBLIC_PORT:-8080}:8080"

  postgres:
    build: ./docker/postgres
    image: distributable-postgres:local
    networks: [internal]
    environment:
      POSTGRES_DB: distributable
      POSTGRES_USER: distributable
      POSTGRES_PASSWORD: distributable
      DB_APP_PASSWORD: distributable_app
      MODULE_DATABASES: "iam analytics notifications"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "distributable"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The users the gateway reads: only iam writes it, only Traefik reads it, nobody else joins `gateway`.
  gateway-cache:
    image: valkey/valkey:8-alpine
    networks: [gateway]
    environment:
      GATEWAY_CACHE_IAM_PASSWORD: ${GATEWAY_CACHE_IAM_PASSWORD:-iam-password}
    command: [valkey-server,
      --user, default, "off",
      --user, iam, "on", ">${GATEWAY_CACHE_IAM_PASSWORD:-iam-password}", "~gateway:user:*", "+@connection", "+setex", "+del", "+ping",
      --user, traefik, "on", ">${REDIS_TRAEFIK_PASSWORD:-traefik-password}", "~gateway:user:*", "+get", "+select"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --user iam --pass \"$$GATEWAY_CACHE_IAM_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  # iam's JWT key pair: iam writes it, Traefik reads the public key.
  jwt-keys:

networks:
  public:
  internal:
  gateway:
